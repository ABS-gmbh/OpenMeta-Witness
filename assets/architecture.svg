<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 416" width="760" height="416" font-family="Helvetica, Arial, sans-serif" font-size="13" role="img" aria-label="Witnesses compare what they saw, so conflicting checkpoints become evidence">
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M0 0L10 5L0 10z" fill="#a9a89c"/>
    </marker>
  </defs>
  <rect width="760" height="416" fill="#ffffff"/>
  <text x="24" y="34" font-size="15" font-weight="600" fill="#1f1f1f">Witnesses compare what they saw, so conflicting checkpoints become evidence</text>
  <g fill="none" stroke="#a9a89c" stroke-width="1.25">
    <path d="M174 108H265" marker-end="url(#arrow)"/>
    <path d="M475 108H586" marker-end="url(#arrow)"/>
    <path d="M370 144V208" marker-end="url(#arrow)"/>
    <path d="M370 176H150V208" marker-end="url(#arrow)"/>
    <path d="M370 176H626V208" marker-end="url(#arrow)"/>
    <path d="M150 280V328" marker-end="url(#arrow)"/>
    <path d="M370 280V328" marker-end="url(#arrow)"/>
  </g>
  <g fill="none" stroke="#a9a89c" stroke-width="1.25">
    <rect x="24" y="72" width="150" height="72" rx="8"/>
    <rect x="265" y="72" width="210" height="72" rx="8"/>
    <rect x="586" y="72" width="150" height="72" rx="8"/>
    <rect x="55" y="208" width="190" height="72" rx="8"/>
    <rect x="275" y="208" width="190" height="72" rx="8"/>
    <rect x="526" y="208" width="200" height="72" rx="8"/>
  </g>
  <rect x="110" y="328" width="300" height="64" rx="8" fill="#e5eefb" stroke="#2f74d0" stroke-width="2"/>
  <g text-anchor="middle">
    <text x="99" y="96" font-weight="600" fill="#1f1f1f">Publisher</text>
    <text x="99" y="116" font-size="11.5" fill="#5f5f5f">signs metadata</text>
    <text x="99" y="132" font-size="11.5" fill="#5f5f5f">with Ed25519</text>
    <text x="370" y="96" font-weight="600" fill="#1f1f1f">Publication log</text>
    <text x="370" y="116" font-size="11.5" fill="#5f5f5f">append-only Merkle tree</text>
    <text x="370" y="132" font-size="11.5" fill="#5f5f5f">operator signs checkpoints</text>
    <text x="661" y="96" font-weight="600" fill="#1f1f1f">Verifier</text>
    <text x="661" y="116" font-size="11.5" fill="#5f5f5f">checks one record</text>
    <text x="661" y="132" font-size="11.5" fill="#5f5f5f">and its proof</text>
    <text x="150" y="232" font-weight="600" fill="#1f1f1f">Witness A</text>
    <text x="150" y="252" font-size="11.5" fill="#5f5f5f">replays records, checks</text>
    <text x="150" y="268" font-size="11.5" fill="#5f5f5f">consistency, countersigns</text>
    <text x="370" y="232" font-weight="600" fill="#1f1f1f">Witness B</text>
    <text x="370" y="252" font-size="11.5" fill="#5f5f5f">same checks, own key</text>
    <text x="370" y="268" font-size="11.5" fill="#5f5f5f">and own database</text>
    <text x="626" y="232" font-weight="600" fill="#1f1f1f">Anchor</text>
    <text x="626" y="252" font-size="11.5" fill="#5f5f5f">104-byte commitment</text>
    <text x="626" y="268" font-size="11.5" fill="#5f5f5f">refuses conflicting roots</text>
    <text x="260" y="354" font-weight="600" fill="#1f1f1f">Compare observations</text>
    <text x="260" y="374" font-size="11.5" fill="#1f1f1f">conflicting checkpoints become evidence</text>
    <text x="219" y="100" font-size="11.5" fill="#5f5f5f">signed record</text>
    <text x="530" y="100" font-size="11.5" fill="#5f5f5f">inclusion proof</text>
  </g>
  <text x="380" y="166" font-size="11.5" fill="#5f5f5f">signed checkpoints</text>
</svg>
