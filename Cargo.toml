[workspace]
resolver = "3"
members = [
    "crates/openmeta-core",
    "crates/openmeta-log",
    "crates/openmeta-store",
    "crates/openmeta-anchor",
    "crates/openmeta-cli",
    "contracts/checkpoint-anchor",
]

[workspace.package]
version = "0.1.0"
edition = "2024"
rust-version = "1.91"
license = "Apache-2.0"

[workspace.dependencies]
openmeta-core = { path = "crates/openmeta-core" }
openmeta-log = { path = "crates/openmeta-log" }
openmeta-store = { path = "crates/openmeta-store" }
openmeta-anchor = { path = "crates/openmeta-anchor" }
anyhow = "1"
clap = { version = "4", features = ["derive", "env"] }
ed25519-dalek = { version = "2.2", features = ["rand_core"] }
hex = "0.4"
rand_core = { version = "0.6", features = ["getrandom"] }
rusqlite = { version = "0.37", features = ["bundled"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sha2 = "0.10"
thiserror = "2"
time = { version = "0.3", features = ["formatting"] }
assert_cmd = "2"
predicates = "3"
tempfile = "3"

